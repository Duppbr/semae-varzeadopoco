<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Consulta Offline – Rios Baterias</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --blue:#2563eb;--green:#16a34a;--slate50:#f8fafc;--slate100:#f1f5f9;
      --slate200:#e2e8f0;--slate400:#94a3b8;--slate500:#64748b;
      --slate700:#334155;--slate900:#0f172a;--white:#ffffff;
      --radius:12px;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--slate100);min-height:100dvh;color:var(--slate900)}

    /* NAVBAR */
    nav{background:var(--white);border-bottom:1px solid var(--slate200);
      padding:10px 16px;display:flex;align-items:center;gap:10px;
      position:sticky;top:0;z-index:50}
    nav img{width:32px;height:32px;border-radius:8px;object-fit:contain}
    nav .title{font-weight:700;font-size:15px;flex:1}
    .badge-offline{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;
      background:#fef3c7;color:#92400e}
    .badge-online{background:#d1fae5;color:#065f46}
    .sync-time{font-size:11px;color:var(--slate400)}

    /* CONTENT */
    .content{max-width:640px;margin:0 auto;padding:12px 12px 80px}

    /* LOJA TABS */
    .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--slate200);
      padding:4px;border-radius:14px}
    .tab{flex:1;padding:8px 4px;font-size:13px;font-weight:600;border:none;
      border-radius:10px;background:transparent;color:var(--slate500);cursor:pointer;transition:.15s}
    .tab.active{background:var(--white);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.1)}

    /* FILTROS */
    .filtros{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .filtro-row{display:flex;gap-8px;display:flex;gap:8px}
    select,input[type=text]{
      width:100%;padding:10px 12px;font-size:14px;border:1.5px solid var(--slate200);
      border-radius:var(--radius);background:var(--white);color:var(--slate900);
      appearance:none;outline:none;transition:.15s}
    select:focus,input[type=text]:focus{border-color:var(--blue)}
    .select-wrap{position:relative;flex:1}
    .select-wrap::after{content:'▾';position:absolute;right:12px;top:50%;
      transform:translateY(-50%);color:var(--slate400);pointer-events:none;font-size:12px}
    .btn-clear{padding:10px 12px;background:var(--slate100);border:1.5px solid var(--slate200);
      border-radius:var(--radius);font-size:13px;color:var(--slate500);cursor:pointer;
      white-space:nowrap;transition:.15s}
    .btn-clear:active{background:var(--slate200)}

    /* RESULTADOS */
    .resultado-header{display:flex;align-items:center;justify-content:space-between;
      margin-bottom:8px;font-size:13px;color:var(--slate500)}
    .resultado-header strong{color:var(--slate900)}

    /* CARD */
    .card{background:var(--white);border-radius:16px;padding:14px 14px;
      margin-bottom:10px;border:1.5px solid var(--slate200)}
    .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
    .card-nome{font-size:15px;font-weight:700;color:var(--slate900);line-height:1.3}
    .card-sub{font-size:12px;color:var(--slate500);margin-top:2px}
    .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;
      box-shadow:0 0 0 2px white,0 0 0 3px currentColor}
    .dot-verde{background:#22c55e;color:#22c55e}
    .dot-amarelo{background:#facc15;color:#facc15}
    .dot-vermelho{background:#ef4444;color:#ef4444}
    .precos{display:flex;gap:8px;flex-wrap:wrap}
    .preco{flex:1;min-width:100px;background:var(--slate50);border-radius:10px;
      padding:8px 10px;text-align:center;border:1px solid var(--slate200)}
    .preco-label{font-size:10px;color:var(--slate500);font-weight:600;text-transform:uppercase;
      letter-spacing:.04em;margin-bottom:2px}
    .preco-val{font-size:16px;font-weight:800;color:var(--slate900)}
    .badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;
      font-weight:600;padding:2px 7px;border-radius:20px;margin-right:4px;margin-top:4px}
    .badge-cca{background:#eff6ff;color:#1d4ed8}
    .badge-gar{background:#f0fdf4;color:#15803d}
    .badge-tipo{background:#f5f3ff;color:#6d28d9}

    /* EMPTY / SYNC */
    .empty{text-align:center;padding:48px 24px;color:var(--slate400)}
    .empty-icon{font-size:40px;display:block;margin-bottom:12px;opacity:.5}
    .empty h3{font-size:16px;font-weight:600;color:var(--slate700);margin-bottom:6px}

    .btn-sync{display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;padding:13px;background:var(--blue);color:var(--white);
      font-size:15px;font-weight:700;border:none;border-radius:14px;
      cursor:pointer;margin-bottom:12px;transition:.15s}
    .btn-sync:active{background:#1d4ed8}
    .btn-sync:disabled{opacity:.5;cursor:default}
    .btn-sync.syncing{background:#1e40af}

    /* SKELETON */
    .sk{background:linear-gradient(90deg,var(--slate200) 25%,var(--slate100) 50%,var(--slate200) 75%);
      background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-card{height:110px;margin-bottom:10px;border-radius:16px}
  </style>
</head>
<body>

<nav>
  <img src="/icon-192.png" alt="Rios Baterias" onerror="this.style.display='none'" />
  <div>
    <div class="title">Rios Baterias</div>
    <div class="sync-time" id="syncTime">Sem dados em cache</div>
  </div>
  <span class="badge-offline badge" id="connBadge">Offline</span>
</nav>

<div class="content">
  <div id="btnSyncWrap" style="display:none">
    <button class="btn-sync" id="btnSync" onclick="sincronizar()">
      🔄 Sincronizar dados agora
    </button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="trocarLoja(1)" id="tab1">🏢 Matriz Artêmia</button>
    <button class="tab" onclick="trocarLoja(2)" id="tab2">🏪 Filial Iguatemi</button>
  </div>

  <div class="filtros">
    <input type="text" id="busca" placeholder="🔍 Buscar por amperagem, marca..." oninput="renderizar()" />
    <div class="filtro-row">
      <div class="select-wrap">
        <select id="filtroTipo" onchange="renderizar()">
          <option value="">Todos os tipos</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="filtroMarca" onchange="renderizar()">
          <option value="">Todas as marcas</option>
        </select>
      </div>
      <button class="btn-clear" onclick="limpar()">✕</button>
    </div>
  </div>

  <div class="resultado-header">
    <span id="resultadoCount">—</span>
  </div>

  <div id="lista"></div>
</div>

<script>
  const CACHE_KEY = 'rb_cache';
  let lojaAtual = 1;
  let cache = {};
  let isOnline = navigator.onLine;

  // Lê parâmetro ?loja= da URL
  const params = new URLSearchParams(location.search);
  if (params.get('loja') === '2') lojaAtual = 2;

  function carregar() {
    try {
      cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    } catch { cache = {}; }

    // Atualiza badge de conexão
    const badge = document.getElementById('connBadge');
    if (isOnline) {
      badge.textContent = 'Online';
      badge.className = 'badge badge-online badge';
      document.getElementById('btnSyncWrap').style.display = 'block';
    } else {
      badge.textContent = 'Offline';
      badge.className = 'badge badge-offline badge';
      document.getElementById('btnSyncWrap').style.display = 'none';
    }

    // Atualiza hora do sync
    const st = document.getElementById('syncTime');
    if (cache.updatedAt) {
      const d = new Date(cache.updatedAt);
      st.textContent = 'Cache: ' + d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    } else {
      st.textContent = 'Sem dados em cache — abra com internet primeiro';
    }

    atualizarFiltros();
    renderizar();
    atualizarTabs();
  }

  function atualizarTabs() {
    document.getElementById('tab1').className = 'tab' + (lojaAtual === 1 ? ' active' : '');
    document.getElementById('tab2').className = 'tab' + (lojaAtual === 2 ? ' active' : '');
  }

  function trocarLoja(id) {
    lojaAtual = id;
    atualizarTabs();
    atualizarFiltros();
    renderizar();
  }

  function getProdutos() {
    return (cache['loja' + lojaAtual] || []);
  }

  function atualizarFiltros() {
    const produtos = getProdutos();
    const tipos = [...new Set(produtos.map(p => p.produto.tipo).filter(Boolean))].sort();
    const marcas = [...new Set(produtos.map(p => p.produto.marca).filter(Boolean))].sort();

    const ft = document.getElementById('filtroTipo');
    const fm = document.getElementById('filtroMarca');
    const vt = ft.value; const vm = fm.value;

    ft.innerHTML = '<option value="">Todos os tipos</option>' + tipos.map(t => `<option${t===vt?' selected':''}>${t}</option>`).join('');
    fm.innerHTML = '<option value="">Todas as marcas</option>' + marcas.map(m => `<option${m===vm?' selected':''}>${m}</option>`).join('');
  }

  function limpar() {
    document.getElementById('busca').value = '';
    document.getElementById('filtroTipo').value = '';
    document.getElementById('filtroMarca').value = '';
    renderizar();
  }

  function fmt(v) {
    return v != null ? 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2}) : null;
  }

  function dotClass(p) {
    return p === 'vermelho' ? 'dot dot-vermelho' : p === 'amarelo' ? 'dot dot-amarelo' : 'dot dot-verde';
  }

  function renderizar() {
    const busca = document.getElementById('busca').value.toLowerCase().trim();
    const tipo = document.getElementById('filtroTipo').value;
    const marca = document.getElementById('filtroMarca').value;
    const lista = document.getElementById('lista');

    let produtos = getProdutos();

    if (!produtos.length) {
      lista.innerHTML = `<div class="empty">
        <span class="empty-icon">📡</span>
        <h3>Nenhum dado em cache</h3>
        <p>Abra o aplicativo com internet para sincronizar os dados.</p>
      </div>`;
      document.getElementById('resultadoCount').innerHTML = '';
      return;
    }

    if (busca) {
      produtos = produtos.filter(p => {
        const prod = p.produto;
        return (
          (prod.amperagem || '').toLowerCase().includes(busca) ||
          (prod.marca || '').toLowerCase().includes(busca) ||
          (prod.tipo || '').toLowerCase().includes(busca) ||
          (prod.nome || '').toLowerCase().includes(busca)
        );
      });
    }
    if (tipo) produtos = produtos.filter(p => p.produto.tipo === tipo);
    if (marca) produtos = produtos.filter(p => p.produto.marca === marca);

    document.getElementById('resultadoCount').innerHTML =
      `<strong>${produtos.length}</strong> produto${produtos.length !== 1 ? 's' : ''} encontrado${produtos.length !== 1 ? 's' : ''}`;

    if (!produtos.length) {
      lista.innerHTML = `<div class="empty">
        <span class="empty-icon">🔍</span>
        <h3>Nenhum resultado</h3>
        <p>Tente outros filtros.</p>
      </div>`;
      return;
    }

    lista.innerHTML = produtos.map(p => {
      const prod = p.produto;
      const cartao = fmt(p.precoCartao);
      const avista = fmt(p.precoAvista);
      const nome = [prod.marca, prod.amperagem, prod.tipo].filter(Boolean).join(' ');
      const sub = [prod.garantia ? prod.garantia + ' garantia' : '', prod.nome].filter(Boolean).join(' · ');

      return `<div class="card">
        <div class="card-header">
          <div>
            <div class="card-nome">${nome || prod.nome}</div>
            ${sub ? `<div class="card-sub">${sub}</div>` : ''}
            <div style="margin-top:6px">
              ${prod.cca ? `<span class="badge badge-cca">⚡ ${prod.cca} CCA</span>` : ''}
              ${prod.tipo ? `<span class="badge badge-tipo">${prod.tipo}</span>` : ''}
              ${prod.garantia ? `<span class="badge badge-gar">🛡 ${prod.garantia}</span>` : ''}
            </div>
          </div>
          <span class="${dotClass(p.prioridade)}" title="${p.prioridade}"></span>
        </div>
        <div class="precos">
          ${cartao ? `<div class="preco"><div class="preco-label">💳 Cartão</div><div class="preco-val">${cartao}</div></div>` : ''}
          ${avista ? `<div class="preco"><div class="preco-label">💰 À vista</div><div class="preco-val">${avista}</div></div>` : ''}
          ${!cartao && !avista ? '<div style="color:#94a3b8;font-size:13px">Sem preço cadastrado</div>' : ''}
        </div>
      </div>`;
    }).join('');
  }

  async function sincronizar() {
    const btn = document.getElementById('btnSync');
    btn.disabled = true;
    btn.className = 'btn-sync syncing';
    btn.textContent = '⏳ Sincronizando...';

    try {
      const [r1, r2] = await Promise.all([
        fetch('/api/produtos-loja?lojaId=1'),
        fetch('/api/produtos-loja?lojaId=2'),
      ]);
      if (r1.ok && r2.ok) {
        const [l1, l2] = await Promise.all([r1.json(), r2.json()]);
        cache = { loja1: l1, loja2: l2, updatedAt: new Date().toISOString() };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        btn.textContent = '✅ Sincronizado!';
        btn.style.background = '#16a34a';
        setTimeout(() => {
          btn.disabled = false;
          btn.className = 'btn-sync';
          btn.innerHTML = '🔄 Sincronizar dados agora';
          btn.style.background = '';
        }, 2500);
        atualizarFiltros();
        renderizar();
        const d = new Date(cache.updatedAt);
        document.getElementById('syncTime').textContent =
          'Cache: ' + d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      } else {
        throw new Error('falha');
      }
    } catch {
      btn.textContent = '❌ Erro — verifique a conexão';
      btn.style.background = '#dc2626';
      setTimeout(() => {
        btn.disabled = false;
        btn.className = 'btn-sync';
        btn.innerHTML = '🔄 Sincronizar dados agora';
        btn.style.background = '';
      }, 3000);
    }
  }

  // Monitora conexão
  window.addEventListener('online', () => { isOnline = true; carregar(); });
  window.addEventListener('offline', () => { isOnline = false; carregar(); });

  carregar();
</script>
</body>
</html>
